<style>
/* Layout: fixed left rail of sections, working canvas on the right; rail becomes a scrolling tab strip on phones. */

  --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #dcefe8;
  --ok: #217a45; --ok-soft: #dff2e5; --warn: #9a5b00; --warn-soft: #fbecd2; --bad: #b42318; --bad-soft: #fde4e1;
  --info: #2a5db0; --info-soft: #e1eafb; --violet: #6b46a8; --violet-soft: #ece4f8; --gray-soft: #e7e9e6;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a1f1c; --sunken: #232a26; --line: #323b36; --fg: #e6ebe7; --muted: #9aa69f;
  --accent: #56b89c; --accent-ink: #0d1411; --accent-soft: #1f3a32;
  --ok: #6fcf8f; --ok-soft: #1d3426; --warn: #f0b45a; --warn-soft: #3a2c15; --bad: #ff8a7a; --bad-soft: #3d1f1b;
  --info: #8db4f5; --info-soft: #1d2a40; --violet: #b99be8; --violet-soft: #2c2340; --gray-soft: #2a302d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a1f1c; --sunken: #232a26; --line: #323b36; --fg: #e6ebe7; --muted: #9aa69f;
  --accent: #56b89c; --accent-ink: #0d1411; --accent-soft: #1f3a32;
  --ok: #6fcf8f; --ok-soft: #1d3426; --warn: #f0b45a; --warn-soft: #3a2c15; --bad: #ff8a7a; --bad-soft: #3d1f1b;
  --info: #8db4f5; --info-soft: #1d2a40; --violet: #b99be8; --violet-soft: #2c2340; --gray-soft: #2a302d; color-scheme: dark }

* { box-sizing: border-box; }

h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; } h3 { font-size: 0.95rem; }
button, input, select, textarea { font: inherit; color: inherit; }

.num, td.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; }
.brand small { display: block; font: 500 0.72rem var(--f-body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 4px; }
nav.sections { display: flex; flex-direction: column; gap: 2px; }
nav.sections a { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: var(--r); color: var(--fg); text-decoration: none; font-weight: 500; }
nav.sections a:hover { background: var(--sunken); }
nav.sections a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

main { min-width: 0; padding-block: 24px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }

.head p { margin: 4px 0 0; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h2 { margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.tile .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.tile .value { font: 600 1.6rem var(--f-mono); font-variant-numeric: tabular-nums; }
.tile.alert { border-color: var(--bad); background: var(--bad-soft); }
.tile.alert .value { color: var(--bad); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunken); }
tr.overdue td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 500; white-space: nowrap; }
.t-slate { background: var(--gray-soft); color: var(--fg); } .t-blue { background: var(--info-soft); color: var(--info); }
.t-amber { background: var(--warn-soft); color: var(--warn); } .t-green { background: var(--ok-soft); color: var(--ok); }
.t-red { background: var(--bad-soft); color: var(--bad); } .t-purple { background: var(--violet-soft); color: var(--violet); }
.t-teal { background: var(--accent-soft); color: var(--accent); }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; min-width: 70px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 2px 8px; font-size: 0.8rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
input, select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 8px; max-width: 100%; }
textarea { width: 100%; min-height: 60px; resize: vertical; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.form .wide { grid-column: 1 / -1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.banner { padding: 10px 14px; border-radius: var(--r); background: var(--bad-soft); color: var(--bad); font-weight: 500; }
.banner.info { background: var(--info-soft); color: var(--info); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.step { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.step.done { border-color: var(--ok); background: var(--ok-soft); }
.step .name { font-weight: 600; font-size: 0.85rem; }
.step .date { font: 0.75rem var(--f-mono); color: var(--muted); }
.list { display: flex; flex-direction: column; }
.list > div { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.list > div > .grow { flex: 1; min-width: 160px; }
.done-text { text-decoration: line-through; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
.timeline div { font-size: 0.85rem; display: grid; grid-template-columns: 130px 1fr; gap: 10px; }
.timeline time { font: 0.75rem var(--f-mono); color: var(--muted); }
.item-type { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r); max-width: 360px; z-index: 20; }
.back { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--line); }
.hbar { display: grid; grid-template-columns: 90px 1fr 40px; gap: 8px; align-items: center; font-size: 0.85rem; }
.hbar .track { height: 14px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); }
.hbar .track i.alt { background: var(--info); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: column; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  nav.sections { flex-direction: row; overflow-x: auto; min-width: 0; }
  nav.sections a { white-space: nowrap; gap: 6px; }
  .who { margin-top: 0; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .timeline div { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">Loan Command Center<small id="roleLabel">Connecting…</small></div>
    <nav class="sections" id="nav" aria-label="Sections"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main">
    <div class="empty">Loading your pipeline…</div>
  </main>
</div>
<div id="toast" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Stage module (mirrors src/lib/stages.ts in the Supabase build)
// ---------------------------------------------------------------------------
const PIPELINE = [
  ["application", "Application", "slate"], ["submitted", "Submitted", "blue"], ["esigned", "E-signed", "blue"],
  ["documents_received", "Documents received", "blue"], ["rate_locked", "Rate locked", "blue"],
  ["underwriting", "Underwriting", "amber"], ["approved", "Approved", "teal"], ["clear_to_close", "Clear to close", "green"],
  ["closing", "Closing", "green"], ["funded", "Funded", "green"],
].map(([key, label, tone]) => ({ key, label, tone }));
const EXCEPTIONS = [["on_hold", "On hold", "amber"], ["restructured", "Restructured", "purple"], ["denied", "Denied", "red"], ["cancelled", "Cancelled", "slate"]]
  .map(([key, label, tone]) => ({ key, label, tone }));
const STAGES = [...PIPELINE, ...EXCEPTIONS];
const FINISHED = new Set(["funded", "cancelled", "denied"]);
const MILESTONES = [
  ["submission", "Submission", "submitted"], ["esign", "E-signing", "esigned"], ["documents", "Documents received", "documents_received"],
  ["rate_lock", "Rate lock", "rate_locked"], ["underwriting", "Underwriting", "underwriting"], ["approval", "Approval", "approved"],
  ["clear_to_close", "Clear to close", "clear_to_close"], ["closing", "Closing", "closing"], ["funding", "Funding", "funded"],
].map(([key, label, stage]) => ({ key, label, stage }));
const PROCESSORS = ["Bobbie", "Adel", "Katie", "Moe"];
const COLOR_TO_PROCESSOR = { purple: "Bobbie", green: "Adel", orange: "Katie", yellow: "Moe" };
const stageInfo = (k) => STAGES.find((s) => s.key === k) || { key: k, label: k, tone: "slate" };
const pos = (k) => PIPELINE.findIndex((s) => s.key === k);
const isFinished = (k) => FINISHED.has(k);
const msInfo = (k) => MILESTONES.find((m) => m.key === k);

function stageAfterMilestone(cur, mKey) {
  if (pos(cur) < 0) return cur; // on hold / restructured keep their stage
  const target = msInfo(mKey).stage;
  return pos(target) > pos(cur) ? target : cur;
}
function progress(loan) {
  const done = MILESTONES.filter((m) => loan.milestones?.[m.key]).length;
  const reqs = loan.requirements || [];
  const reqDone = reqs.filter((r) => r.status !== "outstanding").length;
  const total = MILESTONES.length + reqs.length;
  return Math.round(((done + reqDone) / total) * 100);
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const nowIso = () => new Date().toISOString();
const fmtDate = (iso) => iso ? new Date(iso.length === 10 ? iso + "T12:00:00" : iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—";
const fmtDT = (iso) => iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const money = (n) => (Number(n) || 0).toLocaleString(undefined, { style: "currency", currency: "USD" });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^a-zA-Z0-9-]/g, "");
const pill = (stage) => { const s = stageInfo(stage); return h("span", { class: "pill t-" + s.tone }, s.label); };
const bar = (pct) => h("div", { class: "bar", title: pct + "% complete" }, h("i", { style: `width:${pct}%` }));
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3500); }
const val = (id) => document.getElementById(id)?.value.trim() ?? "";
const monthKey = (iso) => iso ? iso.slice(0, 7) : null;
const daysBetween = (a, b) => (new Date(b) - new Date(a)) / 86400000;

// ---------------------------------------------------------------------------
// State + data access
// ---------------------------------------------------------------------------
const S = {
  ready: false, offline: false, db: null, user: null, me: null, mgmt: false,
  myRoster: null, roster: {}, mapping: {}, // mapping: processor name -> viewer id
  loans: new Map(), contacts: [], invoices: [], payroll: [],
  route: "overview", openLoan: null, filters: {}, importPreview: null, names: {},
};
const deskSubs = new Map();

function loanKey(desk, id) { return desk + "|" + id; }
function loanRef(l) { return l.desk === "pool" ? S.db.doc("pool/" + l.id) : S.db.doc(`desk/${l.desk}/loans/${l.id}`); }
function deskName(desk) {
  if (desk === "pool") return "Unassigned";
  if (S.mgmt) return Object.entries(S.mapping).find(([, v]) => v === desk)?.[0] || "Unconfirmed account";
  return S.myRoster?.name || "Me";
}
function strip(l) { const { desk, id, key, ...rest } = l; return rest; }

const queues = new Map();
function write(ref, body) {
  const p = (queues.get(ref.path) || Promise.resolve()).then(() => ref.set(body)).catch((e) => {
    toast(e?.code === "quota_exceeded" ? "Storage is full. Archive or delete old records, then try again." :
          e?.code === "invalid_argument" ? "You don't have permission to change this record." : "Couldn't save. Check your connection and try again.");
    throw e;
  });
  queues.set(ref.path, p.catch(() => {}));
  return p;
}

function mutate(loan, fn) {
  const body = structuredClone(strip(loan));
  body.events = body.events || [];
  const ev = (type, from, to, extra) => body.events.push({ type, from: from ?? null, to: to ?? null, by: S.me.id, at: nowIso(), ...(extra || {}) });
  fn(body, ev);
  if (body.events.length > 600) body.events = body.events.slice(-600);
  body.updatedAt = nowIso();
  return write(loanRef(loan), body);
}

function setStage(body, ev, next, opts = {}) {
  if (next === body.stage) return;
  ev("stage_changed", body.stage, next);
  body.stage = next;
  body.stageChangedAt = nowIso();
  // A stage set directly still records that milestone's date (not on import).
  const m = MILESTONES.find((x) => x.stage === next);
  if (m && !opts.noStamp && !body.milestones?.[m.key]) {
    body.milestones = body.milestones || {};
    body.milestones[m.key] = { at: nowIso(), by: S.me.id };
    ev("milestone_completed", null, m.key, { auto: true });
  }
}

function completeMilestone(loan, mKey) {
  if (isFinished(loan.stage)) return toast(`This loan is ${stageInfo(loan.stage).label.toLowerCase()}. Milestones are locked.`);
  if (loan.milestones?.[mKey]) return;
  return mutate(loan, (b, ev) => {
    b.milestones = b.milestones || {};
    b.milestones[mKey] = { at: nowIso(), by: S.me.id };
    ev("milestone_completed", null, mKey);
    const next = stageAfterMilestone(b.stage, mKey);
    if (next !== b.stage) { ev("stage_changed", b.stage, next); b.stage = next; b.stageChangedAt = nowIso(); }
  });
}
function reopenMilestone(loan, mKey) {
  if (isFinished(loan.stage)) return toast("Move the loan out of its finished stage before reopening milestones.");
  return mutate(loan, (b, ev) => {
    const was = b.milestones?.[mKey]; if (!was) return;
    delete b.milestones[mKey];
    ev("milestone_reopened", mKey, null, { wasCompletedAt: was.at });
    if (b.stage === msInfo(mKey).stage) {
      const remaining = MILESTONES.filter((m) => b.milestones[m.key]).map((m) => m.stage);
      const fallback = remaining.sort((a, c) => pos(c) - pos(a))[0] || "application";
      ev("stage_changed", b.stage, fallback); b.stage = fallback; b.stageChangedAt = nowIso();
    }
  });
}

async function reassign(loan, newDesk) {
  if (newDesk === loan.desk) return;
  const body = structuredClone(strip(loan));
  body.events = [...(body.events || []), { type: "reassigned", from: deskName(loan.desk), to: deskName(newDesk), by: S.me.id, at: nowIso() }];
  body.updatedAt = nowIso();
  const target = newDesk === "pool" ? S.db.doc("pool/" + loan.id) : S.db.doc(`desk/${newDesk}/loans/${loan.id}`);
  await write(target, body);
  await loanRef(loan).delete();
  S.openLoan = loanKey(newDesk, loan.id);
  toast("Loan reassigned to " + deskName(newDesk));
}

function subscribeDesk(desk) {
  if (deskSubs.has(desk)) return;
  const col = desk === "pool" ? S.db.collection("pool") : S.db.collection(`desk/${desk}/loans`);
  const unsub = col.onSnapshot((snap) => {
    for (const k of [...S.loans.keys()]) if (k.startsWith(desk + "|")) S.loans.delete(k);
    for (const d of snap.docs) S.loans.set(loanKey(desk, d.id), { ...d.data(), desk, id: d.id, key: loanKey(desk, d.id) });
    render();
  }, (e) => console.warn("desk", desk, e));
  deskSubs.set(desk, unsub);
}
function syncDeskSubs() {
  const wanted = new Set(["pool", ...Object.values(S.mapping).filter(Boolean)]);
  for (const [desk, unsub] of deskSubs) if (!wanted.has(desk)) { unsub(); deskSubs.delete(desk); for (const k of [...S.loans.keys()]) if (k.startsWith(desk + "|")) S.loans.delete(k); }
  for (const d of wanted) subscribeDesk(d);
}

async function resolveNames(ids) {
  if (!S.user) return;
  const need = [...new Set(ids.filter((i) => i && !(i in S.names)))];
  if (!need.length) return;
  const ps = await S.user.profiles(need);
  let changed = false;
  for (const id of need) { S.names[id] = ps[id]?.name || ""; changed = true; }
  if (changed) render();
}
const personName = (id) => (id && id === S.me?.id ? "You" : S.names[id]) || "Team member";

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async function boot() {
  if (!window.claude?.use) { S.offline = true; render(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.db = db; S.user = user;
  S.me = user ? await user.me() : null;
  if (!db || !S.me?.id) { S.offline = true; render(); return; }
  S.mgmt = !!S.me.canEdit;

  db.collection("contacts").onSnapshot((s) => { S.contacts = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  if (S.mgmt) {
    db.doc("settings/processors").onSnapshot((d) => { S.mapping = d.exists ? { ...(d.data().mapping || {}) } : {}; syncDeskSubs(); render(); }, () => {});

// Derived data
// ---------------------------------------------------------------------------
function allLoans() { return [...S.loans.values()].sort((a, b) => (a.closingDate || "9999").localeCompare(b.closingDate || "9999")); }
function workItems() {
  const t = today(), items = [];
  for (const l of S.loans.values()) {
    if (isFinished(l.stage)) continue;
    const base = { loan: l };
    for (const task of l.tasks || []) {
      if (task.doneAt) continue;
      if (task.due && task.due < t) items.push({ ...base, type: "Overdue task", sev: 1, title: task.title, due: task.due });
      else if (task.kind === "borrower_follow_up") items.push({ ...base, type: "Borrower follow-up", sev: 2, title: task.title, due: task.due });
      else if (task.due && task.due <= addDays(t, 2)) items.push({ ...base, type: "Task due soon", sev: 2, title: task.title, due: task.due });
    }
    for (const r of l.requirements || []) if (r.status === "outstanding")
      items.push({ ...base, type: r.kind === "condition" ? "Outstanding condition" : "Missing document", sev: r.due && r.due < t ? 1 : 2, title: r.title, due: r.due });
    if (l.closingDate && l.closingDate >= t && l.closingDate <= addDays(t, 7)) items.push({ ...base, type: "Upcoming closing", sev: 2, title: "Closing " + fmtDate(l.closingDate), due: l.closingDate });
    if (l.closingDate && l.closingDate < t && pos(l.stage) < pos("closing")) items.push({ ...base, type: "Closing date passed", sev: 1, title: "Closing was " + fmtDate(l.closingDate), due: l.closingDate });
    if (l.rateLockExpires && l.rateLockExpires <= addDays(t, 5)) items.push({ ...base, type: "Rate lock expiring", sev: l.rateLockExpires < t ? 1 : 2, title: "Lock expires " + fmtDate(l.rateLockExpires), due: l.rateLockExpires });
  }
  return items.sort((a, b) => a.sev - b.sev || (a.due || "9999").localeCompare(b.due || "9999"));
}

const BANDS = [["orange", 18, 42], ["yellow", 48, 64], ["green", 80, 160], ["purple", 262, 318]];

async function previewFile(file) {
